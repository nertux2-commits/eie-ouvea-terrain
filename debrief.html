 m.append(h('h2',{},'Choisir un groupe'),h('p',{class:'mut'},'Toutes les données de terrain (appli + rapports), avec les photos. Chaque correction est enregistrée dans Supabase avec l’ancienne valeur, l’auteur et l’heure.'),
  h('div',{class:'tiles'},T('#plantes','🌿','Plantes',`${pl} saisies : espèces, arbres, jeunes plants, herbier, protégées, envahissantes · noms à vérifier, renommage en un clic`),
   T('#reptiles','🦎','Reptiles',`${c('rep_session')} sessions · ${c('rep_obs')} observations`),T('#oiseaux','🐦','Oiseaux',`${c('oi_session')} sessions · ${c('oi_contact')} contacts · ${c('oi_nid')} nid(s)`),
   T('#fourmis','🐜','Fourmis',`${c('fo_poste')} postes · ${c('fo_obs')} lignes (fioles)`)))}
async function openPlantes(){$('#main').innerHTML='<p class="empty">Ouverture du volet plantes…</p>';try{let t=await(await fetch('revue.html',{cache:'no-store'})).text();const base=location.href.replace(/[^/]*$/,'');
 t=t.replace('<head>','<head><base href="'+base+'">').replace("askWho();load(true);","if(!WHO)askWho();else $('#who').textContent='Correcteur : '+WHO;load(true);").replace('<span class="st" id="who">','<a class="hb" href="debrief.html" style="text-decoration:none">🏠 Accueil</a><span class="st" id="who">');
 location.replace(URL.createObjectURL(new Blob([t],{type:'text/html'})))}catch(e){location.href='revue.html'}}
function route(){const g=location.hash.slice(1);if(g==='plantes'){history.replaceState(null,'','#');return openPlantes()}if(G[g])vGroup(g);else vHome()}
addEventListener('hashchange',()=>{SEL=null;route()});$('#bwho').onclick=askWho;
showWho();route();load(true);setInterval(()=>{if(!document.querySelector('.fm .ch'))load(false)},20000);
</script></body></html>
